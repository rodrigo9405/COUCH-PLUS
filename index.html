<style>
/* Layout: riel lateral de hierro + área de trabajo sobre fondo tiza; los colores de discos olímpicos (25 rojo, 20 azul, 15 amarillo, 10 verde) son la paleta de datos */
:root {
  --bg: #EDF0F3; --surface: #FFFFFF; --surface-2: #F4F6F8; --line: #DDE2E8; --line-2: #C8CFD8;
  --ink: #131820; --ink-2: #4A5563; --ink-3: #7A8592;
  --accent: #1F4FB0; --accent-2: #173E8C; --accent-soft: #E4EBF8; --accent-ink: #FFFFFF;
  --c-red: #C8312B; --c-blue: #1F58B5; --c-yellow: #D9A21B; --c-green: #23885A;
  --good: #1D7A4E; --good-soft: #E0F1E7; --warn: #9C6300; --warn-soft: #FAEED3; --bad: #BE2D27; --bad-soft: #FBE3E1;
  --side: #10151C; --side-2: #1A212B; --side-ink: #C5CEDA; --side-ink-2: #7F8A98;
  --stage-a: #F7F8FA; --stage-b: #DCE2E9; --rest-bg: rgba(237, 240, 243, 0.86); --scrim: rgba(12, 16, 22, 0.52);
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 8px 24px -12px rgba(16, 24, 40, .18);
  --f-display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --f-body: 'Barlow', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --r: 12px; --r-s: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1116; --surface: #151A21; --surface-2: #1B2129; --line: #27303B; --line-2: #36414E;
  --ink: #E8EDF2; --ink-2: #A9B3BF; --ink-3: #76818E;
  --accent: #6E97FF; --accent-2: #8DAEFF; --accent-soft: #1C2944; --accent-ink: #0A1120;
  --c-red: #E0544D; --c-blue: #5288EA; --c-yellow: #E6B43B; --c-green: #3CB37B;
  --good: #47C487; --good-soft: #142D20; --warn: #E5A93C; --warn-soft: #33270F; --bad: #F06B63; --bad-soft: #3B1917;
  --side: #080B0F; --side-2: #121820; --side-ink: #C5CEDA; --side-ink-2: #6F7A88;
  --stage-a: #1C232C; --stage-b: #0F1318; --rest-bg: rgba(13, 17, 22, 0.84); --scrim: rgba(0, 0, 0, 0.62);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px -12px rgba(0, 0, 0, .6);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0D1116; --surface: #151A21; --surface-2: #1B2129; --line: #27303B; --line-2: #36414E;
  --ink: #E8EDF2; --ink-2: #A9B3BF; --ink-3: #76818E;
  --accent: #6E97FF; --accent-2: #8DAEFF; --accent-soft: #1C2944; --accent-ink: #0A1120;
  --c-red: #E0544D; --c-blue: #5288EA; --c-yellow: #E6B43B; --c-green: #3CB37B;
  --good: #47C487; --good-soft: #142D20; --warn: #E5A93C; --warn-soft: #33270F; --bad: #F06B63; --bad-soft: #3B1917;
  --side: #080B0F; --side-2: #121820; --side-ink: #C5CEDA; --side-ink-2: #6F7A88;
  --stage-a: #1C232C; --stage-b: #0F1318; --rest-bg: rgba(13, 17, 22, 0.84); --scrim: rgba(0, 0, 0, 0.62);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px -12px rgba(0, 0, 0, .6);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
#app { min-height: 100%; }
* { box-sizing: border-box; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
code { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: .92em; background: var(--surface-2); padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line); word-break: break-all; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { flex: none; }
.muted { color: var(--ink-2); }
.sm { font-size: 13px; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
.err { color: var(--bad); font-size: 13px; font-weight: 600; }
.good-t { color: var(--good); } .bad-t { color: var(--bad); } .warn-t { color: var(--warn); font-weight: 600; } .danger-t { color: var(--bad) !important; }
.row { display: flex; align-items: center; } .between { justify-content: space-between; } .gap-s { gap: 8px; } .wrap { flex-wrap: wrap; }
.mt { margin-top: 14px; } .mb { margin-bottom: 12px; } .grow { flex: 1; } .center { text-align: center; } .center-b { display: block; margin: 8px auto 0; } .pad { padding: 10px; } .full { width: 100%; } .w120 { width: 120px; }
.stack { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.stack-s { display: flex; flex-direction: column; gap: 10px; } .stack-l { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.only-m { display: none; }

/* ---------- Marca ---------- */
.brand { font-family: var(--f-display); font-weight: 700; font-size: 26px; letter-spacing: .02em; line-height: 1; }
.brand .plus { color: var(--c-yellow); margin-left: 1px; }
.brand.big { font-size: clamp(64px, 9vw, 112px); letter-spacing: .01em; }

/* ---------- Botones ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 40px; padding: 0 16px; border-radius: var(--r-s); border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14.5px; text-decoration: none; white-space: nowrap; transition: background .15s, border-color .15s, transform .05s; }
.btn:hover { border-color: var(--ink-3); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn.ghost { background: transparent; border-color: var(--line); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.sm { height: 32px; padding: 0 11px; font-size: 13px; gap: 5px; }
.btn.big { height: 50px; padding: 0 22px; font-size: 16px; border-radius: 10px; }
.btn.full-w { width: 100%; }
.btn:disabled { opacity: .45; pointer-events: none; }
.icon-btn { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: var(--r-s); border: 0; background: transparent; color: var(--ink-2); position: relative; flex: none; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn.sm { width: 30px; height: 30px; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; text-align: left; }
.link:hover { text-decoration: underline; }
.link.muted { color: var(--ink-3); }
.link-row { background: none; border: 0; padding: 0; text-align: left; }

/* ---------- Formularios ---------- */
.form { display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.field small { font-size: 12px; } .field small.err { font-size: 12px; }
input:not([type=checkbox]):not([type=radio]):not([type=file]), select, textarea { width: 100%; min-height: 40px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: var(--r-s); background: var(--surface); font-size: 15px; transition: border-color .15s, box-shadow .15s; }
textarea { padding: 10px 12px; resize: vertical; line-height: 1.4; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.sel { width: auto !important; min-width: 0; }
.sel.sm { min-height: 32px !important; font-size: 13px !important; padding: 0 8px !important; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.sect-t { font-family: var(--f-display); font-size: 17px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2); padding-top: 6px; border-top: 1px solid var(--line); margin-top: 2px; padding-top: 12px; }
.affix { position: relative; display: flex; align-items: center; }
.affix > span { position: absolute; left: 12px; color: var(--ink-3); font-weight: 600; pointer-events: none; }
.affix > span + input { padding-left: 34px !important; }
.affix.r > button { position: absolute; right: 10px; }
.affix.r > input { padding-right: 70px !important; }
.toggle { position: relative; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; font-weight: 500; user-select: none; }
.toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.toggle .track { width: 42px; height: 24px; border-radius: 12px; background: var(--line-2); position: relative; transition: background .15s; flex: none; }
.toggle .knob { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.toggle input:checked + .track { background: var(--good); }
.toggle input:checked + .track .knob { transform: translateX(18px); }
.toggle input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.seg button { border: 0; background: transparent; height: 32px; padding: 0 14px; border-radius: 7px; font-weight: 600; font-size: 14px; color: var(--ink-2); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(16,24,40,.12); }
.radios { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.radio, .chk { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.chk input, .radio input { width: 18px; height: 18px; accent-color: var(--accent); }

/* ---------- Estructura ---------- */
.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100%; }
.side { position: sticky; top: 0; height: 100vh; height: 100dvh; background: var(--side); color: var(--side-ink); display: flex; flex-direction: column; padding: 22px 14px 16px; gap: 22px; }
.side-brand { display: flex; flex-direction: column; gap: 6px; padding: 0 10px; color: #fff; }
.role-tag { font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--side-ink-2); }
.side-nav { display: flex; flex-direction: column; gap: 3px; }
.nav-i { display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 12px; border-radius: 9px; border: 0; background: transparent; color: var(--side-ink); font-weight: 600; font-size: 15px; text-align: left; }
.nav-i:hover { background: var(--side-2); color: #fff; }
.nav-i.on { background: var(--side-2); color: #fff; }
.nav-i.on .ic { color: var(--c-yellow); }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
.me { display: flex; gap: 10px; align-items: center; padding: 10px; border-top: 1px solid var(--side-2); }
.me > span:not(.avatar) { display: flex; flex-direction: column; min-width: 0; } .me strong { font-size: 14px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .me small { color: var(--side-ink-2); }
.sync { margin: 4px 12px 0; font-size: 12px; color: var(--side-ink-2); display: inline-flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c-green); }
.sync.local::before { background: var(--c-yellow); }
.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 8; display: flex; align-items: center; gap: 14px; padding-block: 18px 14px; padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); background: var(--bg); border-bottom: 1px solid transparent; }
.top-t { flex: 1; min-width: 0; }
.top-t h1 { font-family: var(--f-display); font-weight: 600; font-size: 32px; line-height: 1.05; letter-spacing: .005em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top-brand { display: none; }
.top-a { display: flex; gap: 4px; align-items: center; }
.page { display: flex; flex-direction: column; gap: 16px; padding-block: 6px 48px; padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); max-width: 1320px; width: 100%; }
.page.narrow { max-width: 760px; }
.tabbar { display: none; }

/* ---------- Tarjetas ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.card-h h2 { font-family: var(--f-display); font-weight: 600; font-size: 22px; letter-spacing: .01em; line-height: 1.1; }
.panel { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpis.three { grid-template-columns: repeat(3, minmax(0, 1fr)); margin-block: 6px 16px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi-h { display: flex; justify-content: space-between; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13px; font-weight: 600; }
.kpi-h .ic { color: var(--ink-3); }
.kpi-h span { min-width: 0; }
.kpi strong { font-family: var(--f-display); font-size: 40px; font-weight: 600; line-height: 1.05; font-variant-numeric: tabular-nums; }
.kpi small { color: var(--ink-3); font-size: 12.5px; }
.kpi.good strong { color: var(--good); } .kpi.bad strong { color: var(--bad); } .kpi.warn strong { color: var(--warn); }
.kpi.bad { background: var(--bad-soft); border-color: transparent; } .kpi.bad small, .kpi.bad .kpi-h { color: var(--bad); }
.kv { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.kv:last-of-type { border-bottom: 0; }
.kv span { color: var(--ink-2); } .kv strong { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.note { display: flex; align-items: flex-start; gap: 10px; padding: 11px 14px; border-radius: 10px; font-size: 14px; border: 1px solid transparent; }
.note .ic { margin-top: 2px; }
.note.bad { background: var(--bad-soft); color: var(--bad); } .note.warn { background: var(--warn-soft); color: var(--warn); } .note.good { background: var(--good-soft); color: var(--good); } .note.info { background: var(--accent-soft); color: var(--accent-2); }
.note strong { font-weight: 700; }
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 30px 16px; }
.empty .muted { max-width: 42ch; font-size: 14px; }
.empty-ic { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-3); border: 1px solid var(--line); margin-bottom: 4px; }
.pill { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.pill.good { background: var(--good-soft); color: var(--good); border-color: transparent; } .pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; } .pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; } .pill.accent { background: var(--accent-soft); color: var(--accent-2); border-color: transparent; }
.badge { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--bad); color: #fff; font-size: 12px; font-weight: 700; }
.tab .badge { margin-left: 6px; }
.avatar { display: inline-grid; place-items: center; border-radius: 50%; font-family: var(--f-display); font-weight: 700; flex: none; letter-spacing: .02em; }
.plate { display: inline-grid; place-items: center; border-radius: 50%; background: var(--pc); color: var(--pi); font-family: var(--f-display); font-weight: 700; flex: none; box-shadow: inset 0 0 0 3px var(--pc), inset 0 0 0 4.5px rgba(255,255,255,.4), 0 0 0 1px rgba(0,0,0,.1); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--ink-3); }
.dot.good { background: var(--good); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); } .dot.info { background: var(--accent); }
.list { list-style: none; margin: 0; padding: 0; }
.li { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.li:last-child { border-bottom: 0; }
.li-main { display: flex; flex-direction: column; min-width: 0; flex: 1 1 150px; }
.li-main strong { font-weight: 600; overflow-wrap: break-word; }
.li-act { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; margin-left: auto; }
.clickable { cursor: pointer; } .li.clickable:hover { background: var(--surface-2); margin-inline: -10px; padding-inline: 10px; border-radius: 8px; }
.bad-row strong { color: var(--bad); }
.mini-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.mini-list li { display: flex; justify-content: space-between; gap: 10px; }
.hist { list-style: none; padding: 0; margin: 0; font-size: 14px; }
.hist li { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
.creds { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.creds code { display: block; font-size: 15px; padding: 10px 12px; margin-top: 6px; }
.status-bar { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 10px; flex-wrap: wrap; }
.status-bar.on { background: var(--good-soft); } .status-bar.off { background: var(--bad-soft); }

/* ---------- Tablas ---------- */
.table-wrap { overflow-x: auto; margin-inline: -4px; padding-inline: 4px; }
.tbl { width: 100%; border-collapse: collapse; min-width: 640px; font-size: 14px; }
.tbl.sm { min-width: 0; font-size: 13px; margin-top: 10px; }
.tbl th { text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl .act { text-align: right; white-space: nowrap; }
.tbl td .stack > span:first-child { white-space: nowrap; }
.tbl td .pill { white-space: normal; height: auto; min-height: 22px; padding-block: 2px; line-height: 1.25; }
.tbl tr.dim td { opacity: .55; } .tbl tr.dim td:last-child, .tbl tr.dim td:nth-last-child(2) { opacity: 1; }
.tbl tr.clickable:hover td { background: var(--surface-2); }
.cell-person { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; text-align: left; min-width: 0; }
.cell-person > span:not(.avatar) { display: flex; flex-direction: column; min-width: 0; } .cell-person small { font-size: 12.5px; }
button.cell-person:hover strong { color: var(--accent); }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.toolbar > p { flex: 1; min-width: 200px; }
.search { position: relative; flex: 1; min-width: 200px; max-width: 420px; display: flex; align-items: center; }
.search .ic { position: absolute; left: 12px; color: var(--ink-3); }
.search input { padding-left: 36px !important; }
.minibar { display: flex; flex-direction: column; gap: 4px; min-width: 100px; font-size: 12.5px; color: var(--ink-2); }

  ];
  const MUSCLE = [['bench', ['pecho', 'pectoral']], ['pulldown', ['dorsal']], ['row', ['espalda']], ['squat', ['pierna', 'cuadriceps', 'muslo']], ['hipthrust', ['gluteo']],
    ['ohp', ['hombro']], ['curl', ['brazo']], ['crunch', ['abdomen', 'abs', 'core']]];
  function classify(name) {
    const n = norm(name);
    const db = /mancuerna|dumbbell|\bdb\b/.test(n);
    const bar = /barra|barbell|\bz\b|ez/.test(n);
    for (const [k, words] of RULES) {
      if (words.some(w => n.includes(w))) {
        if (k === 'bench' && db) return 'bench_db';
        if (k === 'ohp' && db) return 'ohp_db';
        if (k === 'row' && db) return 'row_db';
        if (k === 'curl' && bar && !db) return 'curl_bar';
        return k;
      }
    }
    for (const [k, words] of MUSCLE) if (words.some(w => n.includes(w))) return k;
    return 'idle';
  }

  function build(THREE) {
    const M = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.62, metalness: 0.05 }, o));
    const mat = {
      skin: M(0xc98b62, { roughness: 0.55 }), top: M(0x1d4f91), shorts: M(0x272c33), shoe: M(0xeeeeea), sole: M(0xd23a2e),
      hair: M(0x221a14, { roughness: 0.9 })

    const cap = (r, l, m) => { const g = new THREE.Mesh(new THREE.CapsuleGeometry(r, l, 6, 14), m); g.castShadow = true; return g; };
    const sph = (r, m, s) => { const g = new THREE.Mesh(new THREE.SphereGeometry(r, 22, 16), m); if (s) g.scale.set(...s); g.castShadow = true; return g; };
    const grp = (p, par) => { const g = new THREE.Group(); g.position.set(...p); if (par) par.add(g); return g; };

    const root = new THREE.Group();
    const pelvis = sph(0.15, mat.shorts, [1.08, 0.72, 0.78]); pelvis.position.y = -0.02; root.add(pelvis);
    const spine = grp([0, 0.02, 0], root);
    const abd = sph(0.14, mat.top, [1.0, 1.15, 0.78]); abd.position.y = 0.17; spine.add(abd);
    const chest = sph(0.2, mat.top, [1.0, 0.82, 0.66]); chest.position.y = 0.38; spine.add(chest);

/* ---------- Entrenamiento ---------- */
const toKg = (w, u) => u === 'lb' ? w * 0.453592 : w;

  const logs = Q.logs(st.id).filter(l => (l.routineVer || 0) === (r.ver || 0));
  if (!logs.length) return 0;
  return ((logs[logs.length - 1].dayIdx || 0) + 1) % r.days.length;
}
function bestOf(ex) { let mw = 0, mr = 0, vol = 0; (ex.sets || []).forEach(s => { const w = toKg(Number(s.w) || 0, s.u); mw = Math.max(mw, w); mr = Math.max(mr, Number(s.reps) || 0); vol += w * (Number(s.reps) || 0); }); return { mw, mr, vol }; }

  const n = normTxt(name);
  return Q.logs(sid).filter(l => l.status === 'done' && (!beforeTs || l.ts < beforeTs)).map(l => ({ l, ex: (l.exercises || []).find(e => normTxt(e.name) === n) })).filter(x => x.ex && (x.ex.sets || []).length);
}
function improvements(sid, exercises, ts) {
  const out = [];
  exercises.forEach(ex => {
    if (!(ex.sets || []).length) return;
    const cur = bestOf(ex), hist = exHistory(sid, ex.name, ts);
    if (!hist.length) { out.push({ kind: 'first', name: ex.name, cur }); return; }
    const dayMs = 86400000;
    const pick = (lo, hi) => { const c = hist.filter(h => ts - h.l.ts >= lo * dayMs && ts - h.l.ts <= hi * dayMs); return c.length ? c[c.length - 1] : null; };
    const week = pick(4, 11) || hist[hist.length - 1];
    const month = pick(24, 40);
    [[week, 'semana pasada'], [month, 'mes pasado']].forEach(([h, label]) => {
      if (!h) return;
      const p = bestOf(h.ex);
      if (cur.mw > p.mw + 0.01) out.push({ kind: 'up', name: ex.name, label, txt: `${numStr(round1(p.mw))} → ${numStr(round1(cur.mw))} kg` });

    });
  });
  const seen = new Set();

}

/* ---------- Adherencia y omisiones ---------- */
function rangeDates(from, to) { const out = []; let d = from; let g = 0; while (d <= to && g++ < 800) { out.push(d); d = addDays(d, 1); } return out; }
function stats(st, from, to) {
  const t = today(); const start = st.inicio && st.inicio > from ? st.inicio : from;
  const end = to > t ? t : to;
  const logs = Q.logs(st.id).filter(l => l.date >= from && l.date <= to);
  const done = logs.filter(l => l.status === 'done'), skipped = logs.filter(l => l.status === 'skipped');

  let noLog = 0;
  if (start <= end) rangeDates(start, end).forEach(d => {
    const pm = plannedMeals(st, dow(d)); const log = Q.meal(st.id, d); const ch = log?.checks || {};

    if (!Object.keys(ch).length) { if (d !== t) noLog++; return; }
    pm.forEach(({ meal }) => {
      const v = ch[meal.id];
      if (d === t && !v) return;
      planned++;
      if (v === 'done') ate++;
      else if (v === 'skip') { skippedMeals++; mealSkips.push({ date: d, meal: meal.name, reason: (log.reasons || {})[meal.id] || '' }); }
    });
  });
  const vol = done.reduce((a, l) => a + (l.exercises || []).reduce((b, e) => b + bestOf(e).vol, 0), 0);
  return {
    done: done.length, skipped: skipped.length, skippedLogs: skipped, logs,
    trainPct: done.length + skipped.length ? Math.round(done.length / (done.length + skipped.length) * 100) : null,
    planned, ate, skippedMeals, mealSkips, noLog, dietPct: planned ? Math.round(ate / planned * 100) : null, vol
  };
}

}

  if (sess.role === 'super') {
    Q.trainers().forEach(tr => { const p = payState(tr.nextPay); if (['late', 'today', 'soon'].includes(p.k)) out.push({ kind: p.k === 'late' ? 'bad' : 'warn', title: `Pago de ${fullName(tr)}`, text: `${p.label} · ${fmtD(tr.nextPay)}`, go: { view: 'trainers', id: tr.id } }); });
  } else if (sess.role === 'trainer') {
    const tr = Q.trainer(sess.id); if (!tr) return out;
    const p = payState(tr.nextPay);
    if (['late', 'today', 'soon'].includes(p.k)) out.push({ kind: p.k === 'late' ? 'bad' : 'warn', title: 'Tu suscripción COUCH+', text: `${p.label} · ${fmtD(tr.nextPay)}`, go: { view: 'account' } });
    Q.students(tr.id).forEach(s => {
      if (s.remind) { const ps = payState(s.nextPay); if (['late', 'today', 'soon'].includes(ps.k)) out.push({ kind: ps.k === 'late' ? 'bad' : 'warn', title: `Pago de ${fullName(s)}`, text: `${ps.label} · ${fmtD(s.nextPay)}`, go: { view: 'student', id: s.id, tab: 'perfil' } }); }
      if (s.nextReview && s.nextReview <= t) out.push({ kind: 'info', title: `Revisión de ${fullName(s)}`, text: s.nextReview === t ? 'Programada para hoy' : `Pendiente desde ${fmtD(s.nextReview)}`, go: { view: 'student', id: s.id, tab: 'revisiones' } });
      Q.logs(s.id).filter(l => l.status === 'skipped' && diffDays(l.date, t) <= 3).forEach(l => out.push({ kind: 'bad', title: `${s.nombres} omitió ${l.dayName}`, text: l.reason ? `“${l.reason}”` : 'Sin motivo', go: { view: 'student', id: s.id, tab: 'progreso' } }));
    });
  } else if (sess.role === 'student') {
    const s = Q.student(sess.id); if (!s) return out;
    if (s.remind) { const ps = payState(s.nextPay); if (['late', 'today', 'soon'].includes(ps.k)) out.push({ kind: ps.k === 'late' ? 'bad' : 'warn', title: 'Recordatorio de pago', text: `Tu próximo pago: ${fmtD(s.nextPay)} · ${ps.label.toLowerCase()}`, go: { view: 'home' } }); }

/* ---------- Imagen ---------- */
function compressImage(file, max = 1000) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('read'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('img'));
      img.onload = () => {
        let q = 0.78, m = max, out = '';
        for (let i = 0; i < 6; i++) {
          const s = Math.min(1, m / Math.max(img.width, img.height));
          const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          out = c.toDataURL('image/jpeg', q);
          if (out.length < 190000) break;
          q -= 0.1; m = Math.round(m * 0.82);
        }
        res(out);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

const Accounts = (() => {

    async reassign(sid, tid) { const { error } = await SB.rpc('cp_reassign_student', { p_student: sid, p_trainer: tid }); return res(error); },
    async changeAdmin({ cur, pass, pin }) {

  const X = t => pl + (t - x0) / (x1 - x0) * (W - pl - pr), Y = v => pt + (1 - (v - y0) / (y1 - y0)) * (H - pt - pb);
  const pts = data.map((d, i) => [X(xs[i]), Y(d.y)]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = line + ` L${pts[pts.length - 1][0].toFixed(1)} ${H - pb} L${pts[0][0].toFixed(1)} ${H - pb} Z`;
  const ticks = [0, 0.5, 1].map(f => y0 + padY + (y1 - y0 - 2 * padY) * f);

    <defs><linearGradient id=${gid} x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color=${color} stop-opacity="0.22" /><stop offset="1" stop-color=${color} stop-opacity="0" /></linearGradient></defs>
    ${ticks.map(v => html`<line x1=${pl} x2=${W - pr} y1=${Y(v)} y2=${Y(v)} class="grid-l" /><text x=${pl - 8} y=${Y(v) + 4} text-anchor="end" class="axis-t">${numStr(round1(v))}</text>`)}

    <text x=${pl} y=${H - 8} class="axis-t">${fmtDs(data[0].x)}</text>
    ${data.length > 1 && html`<text x=${W - pr} y=${H - 8} text-anchor="end" class="axis-t">${fmtDs(data[data.length - 1].x)}</text>`}
  </svg>`;
}

    <div class="ring-t"><strong>${pct == null ? '—' : pct + '%'}</strong>${label && html`<span>${label}</span>`}</div></div>`;
}
function Bars({ items, h = 120, unit = '' }) {
  const max = Math.max(1, ...items.map(i => i.v));
  return html`<div class="bars" style=${`height:${h}px`}>${items.map(i => html`<div class="bar-col" title=${`${i.label}: ${i.v}${unit}`}>
    <span class="bar-v">${i.v || ''}</span><div class="bar" style=${`height:${Math.max(2, i.v / max * (h - 38))}px;background:${i.color || 'var(--accent)'}`}></div><span class="bar-l">${i.label}</span></div>`)}</div>`;
}

function Stage3D({ name, cls = '' }) {
  const ref = useRef(), st = useRef(null), first = useRef(true);
  const [label, setLabel] = useState('');
  useEffect(() => {
    const css = getComputedStyle(document.documentElement);
    st.current = Fig3D.mount(ref.current, name, { lineColor: css.getPropertyValue('--ink-3').trim() || '#8892a0' });
    setLabel(st.current.label ? st.current.label() : '');
    return () => st.current && st.current.destroy();
  }, []);
  useEffect(() => { if (first.current) { first.current = false; return; } if (st.current) { st.current.set(name); setLabel(st.current.label ? st.current.label() : ''); } }, [name]);
  return html`<div class=${'stage-wrap ' + cls}><div class="stage" ref=${ref}></div><span class="stage-tag"><${Ic} n="cube" s=${13} /> ${label} · arrastra para girar</span></div>`;
}
function preview3D(name) { openModal(({ close }) => html`<${Modal} title=${name || 'Ejercicio'} sub="Vista de referencia del movimiento" onClose=${close} size="lg"><${Stage3D} name=${name} cls="tall" /><//>`); }

/* COUCH+ · formularios y acciones compartidas */
async function delStudentCascade(sid) {
  const st = Q.student(sid);
  if (st) { const r = await Accounts.remove('student', st); if (r.err) { toast(r.err, 'bad'); return false; } }
  Q.reviews(sid).forEach(r => { (r.photos || []).forEach(p => Store.delPhoto(p.pid)); Store.del('reviews', r.id); });
  Q.logs(sid).forEach(l => Store.del('logs', l.id));
  Q.meals(sid).forEach(m => Store.del('meals', m.id));
  Store.del('students', sid);
  return true;
}
async function delTrainerCascade(tid, reassignTo) {
  for (const s of Q.students(tid)) {
    if (reassignTo) { const r = await Accounts.reassign(s.id, reassignTo); if (r.err) { toast(r.err, 'bad'); return false; } }
    else if (!(await delStudentCascade(s.id))) return false;
  }
  const t = Q.trainer(tid);
  if (t) { const r = await Accounts.remove('trainer', t); if (r.err) { toast(r.err, 'bad'); return false; } }
  Store.all('tpl').filter(x => x.trainerId === tid).forEach(x => Store.del('tpl', x.id));
  Store.del('trainers', tid);
  return true;
}

function PersonForm({ close, kind, rec, trainerId, onSaved }) {
  const isT = kind === 'trainer', edit = !!rec;
  const t0 = today();
  const [f, setF] = useState(() => rec ? Object.assign({ pass: '' }, clone(rec)) : {
    nombres: '', apellidos: '', dni: '', telefono: '', user: '', pass: '', inicio: t0, freq: 'mensual', nextPay: nextFrom(t0, 'mensual'), monto: '',
    active: true, remind: true, trainerId: trainerId || (Q.trainers()[0] || {}).id || '', nextReview: ''
  });
  const [touched, setTouched] = useState(!!rec);
  const [err, setErr] = useState({});
  const [saving, setSaving] = useState(false);
  const set = (k, v) => setF(o => {
    const n = Object.assign({}, o, { [k]: v });
    if ((k === 'inicio' || k === 'freq') && !touched && n.inicio) n.nextPay = nextFrom(n.inicio, n.freq);
    return n;
  });
  const b = k => ({ value: f[k] ?? '', onInput: e => set(k, e.target.value) });
  async function save(e) {
    e && e.preventDefault();
    if (saving) return;
    const er = {};
    if (!f.nombres.trim()) er.nombres = 'Escribe los nombres';
    if (!f.apellidos.trim()) er.apellidos = 'Escribe los apellidos';
    if (f.dni && !/^\d{8,12}$/.test(f.dni.trim())) er.dni = 'El DNI debe tener solo números (8 dígitos)';
    if (!f.user.trim()) er.user = 'Define un usuario';
    else if (f.user.trim().length > 30) er.user = 'Máximo 30 caracteres';
    else if (Q.userTaken(f.user, rec && rec.id)) er.user = 'Ese usuario ya existe';
    if (!edit && f.pass.length < 6) er.pass = 'Mínimo 6 caracteres';
    if (edit && f.pass && f.pass.length < 6) er.pass = 'Mínimo 6 caracteres';
    if (!f.inicio) er.inicio = 'Elige la fecha de inicio';
    if (!isT && !f.trainerId) er.trainerId = 'Asigna un entrenador';
    if ((isT || f.remind) && !f.nextPay) er.nextPay = 'Elige la fecha';
    setErr(er); if (Object.keys(er).length) return;
    const pass = f.pass;
    const o = Object.assign({}, rec || {}, f);
    delete o.pass;
    o.user = f.user.trim(); o.nombres = f.nombres.trim(); o.apellidos = f.apellidos.trim(); o.dni = (f.dni || '').trim();
    const ak = isT ? 'trainer' : 'student';
    setSaving(true);
    if (!edit) {
      o.id = uid();
      const r = await Accounts.create(ak, o, pass);
      if (r.err) { setSaving(false); setErr(/usuario/i.test(r.err) ? { user: r.err } : { pass: r.err }); return; }
      Object.assign(o, r.patch || {});
      o.createdAt = Date.now(); o.payments = (isT || f.remind) ? [{ date: f.inicio, paidOn: f.inicio, note: 'Pago inicial', monto: f.monto }] : [];
    } else {
      if (o.user !== rec.user) { const r = await Accounts.rename(ak, rec, o.user); if (r.err) { setSaving(false); setErr({ user: r.err }); return; } }
      if (pass) { const r = await Accounts.setPassword(ak, rec, pass); if (r.err) { setSaving(false); setErr({ pass: r.err }); return; } Object.assign(o, r.patch || {}); }
      if (!isT && rec.trainerId !== o.trainerId) { const r = await Accounts.reassign(rec.id, o.trainerId); if (r.err) { setSaving(false); setErr({ trainerId: r.err }); return; } }
    }
    if (!isT && !o.nextReview) o.nextReview = null;
    const saved = Store.put(isT ? 'trainers' : 'students', o);
    close();
    toast(edit ? 'Cambios guardados' : (isT ? 'Entrenador creado' : 'Alumno creado'));
    if (!edit) openModal(CredsModal, { p: saved, pass, role: ak });
    onSaved && onSaved(saved);
  }
  const trainers = Q.trainers();
  return html`<${Modal} title=${edit ? 'Editar ' + (isT ? 'entrenador' : 'alumno') : (isT ? 'Nuevo entrenador' : 'Nuevo alumno')} onClose=${close} size="md"
    footer=${html`<button class="btn ghost" onClick=${close}>Cancelar</button><button class="btn primary" disabled=${saving} onClick=${save}>${saving ? 'Guardando…' : edit ? 'Guardar cambios' : 'Crear cuenta'}</button>`}>
    <form class="form" onSubmit=${save}>
      <div class="grid2">
        <${Field} label="Nombres" error=${err.nombres}><input id="pf-nombres" ...${b('nombres')} autocomplete="off" /><//>
        <${Field} label="Apellidos" error=${err.apellidos}><input id="pf-apellidos" ...${b('apellidos')} autocomplete="off" /><//>
        <${Field} label="DNI" error=${err.dni}><input id="pf-dni" inputmode="numeric" maxlength="12" ...${b('dni')} /><//>
        <${Field} label="Teléfono" hint="Para recordatorios por WhatsApp"><input id="pf-tel" type="tel" inputmode="tel" placeholder="987 654 321" ...${b('telefono')} /><//>
      </div>
      ${!isT && trainerId == null && html`<${Field} label="Entrenador asignado" error=${err.trainerId}><select id="pf-trainer" value=${f.trainerId} onChange=${e => set('trainerId', e.target.value)}>
        <option value="" selected=${!f.trainerId}>Selecciona…</option>${trainers.map(t => html`<option value=${t.id} selected=${t.id === f.trainerId}>${fullName(t)}${t.active === false ? ' (inactivo)' : ''}</option>`)}</select><//>`}
      <div class="sect-t">Acceso</div>
      <div class="grid2">
        <${Field} label="Usuario" error=${err.user}><input id="pf-user" autocomplete="off" autocapitalize="characters" ...${b('user')} /><//>
        <${Field} label=${edit ? 'Nueva contraseña' : 'Contraseña'} hint=${edit ? 'Déjala vacía para mantener la actual' : 'Mínimo 6 caracteres'} error=${err.pass}><input id="pf-pass" type="text" autocomplete="new-password" ...${b('pass')} /><//>
      </div>
      <div class="sect-t">${isT ? 'Suscripción a COUCH+' : 'Servicio y pagos'}</div>
      <div class="grid2">
        <${Field} label=${isT ? 'Fecha de pago (inicio)' : 'Inicio del servicio'} error=${err.inicio}><input id="pf-inicio" type="date" ...${b('inicio')} onChange=${e => set('inicio', e.target.value)} /><//>
        ${!isT && html`<div class="field"><span>Recordatorio de pago</span><${Toggle} id="pf-remind" checked=${f.remind} onChange=${v => set('remind', v)} label=${f.remind ? 'Activado' : 'Desactivado'} /></div>`}
      </div>
      ${(isT || f.remind) && html`<div class="grid3">
        <${Field} label="Frecuencia"><select id="pf-freq" value=${f.freq} onChange=${e => set('freq', e.target.value)}>${Object.entries(FREQ).map(([k, v]) => html`<option value=${k} selected=${k === f.freq}>${v.label}</option>`)}</select><//>
        <${Field} label="Próximo pago" hint="Se calcula solo; puedes editarlo" error=${err.nextPay}><input id="pf-next" type="date" value=${f.nextPay || ''} onInput=${e => { setTouched(true); set('nextPay', e.target.value); }} /><//>
        <${Field} label="Monto (opcional)"><div class="affix"><span>S/</span><input id="pf-monto" inputmode="decimal" ...${b('monto')} /></div><//>
      </div>`}
      ${!isT && !edit && html`<${Field} label="Primera revisión (opcional)"><input id="pf-review" type="date" value=${f.nextReview || ''} onInput=${e => set('nextReview', e.target.value)} /><//>`}
      ${isT && html`<div class="field"><span>Estado</span><${Toggle} id="pf-active" checked=${f.active !== false} onChange=${v => set('active', v)} label=${f.active !== false ? 'Activo: puede ingresar con sus alumnos' : 'Inactivo: sin acceso para él ni sus alumnos'} /></div>`}
      <button type="submit" hidden></button>
    </form>
  <//>`;
}

function askDeleteTrainer(t) {

    const [to, setTo] = useState(others[0] ? others[0].id : '');
    const [busy, setBusy] = useState(false);
    const ok = async () => { setBusy(true); const done = await delTrainerCascade(t.id, mode === 'move' ? to : null); setBusy(false); if (done) { close(); toast('Entrenador eliminado'); } };
    return html`<${Modal} title="Eliminar entrenador" sub=${fullName(t)} onClose=${close} size="sm" footer=${html`<button class="btn ghost" onClick=${close}>Cancelar</button><button class="btn danger" disabled=${busy} onClick=${ok}>${busy ? 'Eliminando…' : 'Eliminar'}</button>`}>

function AdminSecurity() {
  const [f, setF] = useState({ cur: '', pass: '', pin: '' }); const [err, setErr] = useState(''); const [busy, setBusy] = useState(false);
  const save = async e => {
    e.preventDefault(); setErr('');
    if (!f.cur) { setErr('Escribe tu contraseña actual'); return; }
    if (f.pass && f.pass.length < 8) { setErr('La nueva contraseña debe tener al menos 8 caracteres'); return; }
    if (f.pin && !/^\d{4}$/.test(f.pin)) { setErr('El código debe tener exactamente 4 dígitos'); return; }
    if (!f.pass && !f.pin) { setErr('Escribe una nueva contraseña o un nuevo código'); return; }
    setBusy(true); const r = await Accounts.changeAdmin(f); setBusy(false);
    if (r.err) { setErr(r.err); return; }
    setF({ cur: '', pass: '', pin: '' }); toast('Credenciales actualizadas');
  };
  return html`<div class="page narrow"><section class="card">
    <div class="card-h"><h2>Acceso de superadministrador</h2></div>
    <p class="muted">El usuario <code>${Accounts.username()}</code> entra con contraseña y un código de 4 dígitos.</p>
    <form class="form" onSubmit=${save}>
      <${Field} label="Contraseña actual"><input id="sec-cur" type="password" autocomplete="current-password" value=${f.cur} onInput=${e => setF({ ...f, cur: e.target.value })} /><//>
      <div class="grid2"><${Field} label="Nueva contraseña" hint="Opcional · mínimo 8 caracteres"><input id="sec-pass" type="password" autocomplete="new-password" value=${f.pass} onInput=${e => setF({ ...f, pass: e.target.value })} /><//>
      <${Field} label="Nuevo código de 4 dígitos" hint="Opcional"><input id="sec-pin" inputmode="numeric" maxlength="4" value=${f.pin} onInput=${e => setF({ ...f, pin: e.target.value.replace(/\D/g, '') })} /><//></div>
      ${err && html`<p class="err">${err}</p>`}
      <div><button class="btn primary" disabled=${busy}>${busy ? 'Guardando…' : 'Guardar'}</button></div>
    </form></section></div>`;
}

  const [open, setOpen] = useState(false);

  const steps = [...(slot.steps || []).filter(Boolean).map(s => ({ s })), ...(slot.dishes || []).flatMap(d => (d.steps || []).filter(Boolean).map(s => ({ s, d: d.name })))];
  return html`<div class=${'slot ' + (compact ? 'compact' : '')}>
    ${(slot.dishes || []).map(d => html`<div class="dish"><span class="dish-n"><${Ic} n="book" s=${13} /> ${d.name}</span><span class="dish-i">${(d.items || []).map(itemShort).join(' + ')}</span></div>`)}

    ${steps.length > 0 && html`<button type="button" class="link sm" onClick=${e => { e.stopPropagation(); setOpen(!open); }}>${open ? 'Ocultar preparación' : 'Ver preparación'}</button>

  </div>`;
}

/* ---------- Progreso ---------- */
function ProgressPanel({ st, role }) {
  useStore();
  const t = today();
  const [mode, setMode] = useState('mes');
  const [day, setDay] = useState(t);
  const [month, setMonth] = useState(t.slice(0, 7));
  const [year, setYear] = useState(t.slice(0, 4));
  const range = mode === 'dia' ? [day, day] : mode === 'mes' ? [month + '-01', addDays(addMonths(month + '-01', 1), -1)] : mode === 'anio' ? [year + '-01-01', year + '-12-31'] : [st.inicio || '2000-01-01', t];
  const S = stats(st, range[0], range[1]);
  const mnames = measureNames(st.id);
  const [mSel, setMSel] = useState(() => (mnames.find(m => /peso/i.test(m.name)) || mnames[0] || {}).name || '');
  const exNames = useMemo(() => { const m = new Map(); Q.logs(st.id).forEach(l => (l.exercises || []).forEach(e => { if ((e.sets || []).length) m.set(normTxt(e.name), e.name); })); return Array.from(m.values()); }, [Store.ver]);
  const [exSel, setExSel] = useState(exNames[0] || '');
  const exSeries = exSel ? exHistory(st.id, exSel).map(h => ({ x: h.l.date, y: round1(bestOf(h.ex).mw) })) : [];
  const years = []; for (let y = Number(t.slice(0, 4)); y >= Number((st.inicio || t).slice(0, 4)); y--) years.push(String(y));
  const dayLogs = S.logs.slice().reverse();
  return html`<div class="progress">
    <div class="toolbar"><${Seg} options=${[{ k: 'dia', label: 'Día' }, { k: 'mes', label: 'Mes' }, { k: 'anio', label: 'Año' }, { k: 'todo', label: 'Todo' }]} value=${mode} onChange=${setMode} />
      ${mode === 'dia' && html`<input id="pg-day" type="date" class="sel" value=${day} max=${t} onInput=${e => e.target.value && setDay(e.target.value)} />`}
      ${mode === 'mes' && html`<input id="pg-month" type="month" class="sel" value=${month} onInput=${e => e.target.value && setMonth(e.target.value)} />`}
      ${mode === 'anio' && html`<select id="pg-year" class="sel" value=${year} onChange=${e => setYear(e.target.value)}>${years.map(y => html`<option value=${y} selected=${y === year}>${y}</option>`)}</select>`}
    </div>
    <div class="kpis">
      <${Kpi} label="Entrenamientos" value=${S.done} sub=${S.trainPct != null ? `${S.trainPct}% de cumplimiento` : 'Sin registros'} icon="dumbbell" tone=${S.done ? 'good' : ''} />
      <${Kpi} label="Días omitidos" value=${S.skipped} sub=${S.skipped ? 'Con motivo enviado al entrenador' : 'Ninguno'} icon="alert" tone=${S.skipped ? 'bad' : ''} />
      <${Kpi} label="Dieta cumplida" value=${S.dietPct == null ? '—' : S.dietPct + '%'} sub=${`${S.ate} de ${S.planned} comidas${S.noLog ? ` · ${S.noLog} días sin registro` : ''}`} icon="food" />
      <${Kpi} label="Comidas omitidas" value=${S.skippedMeals} sub=${S.skippedMeals ? 'Marcadas como no realizadas' : 'Ninguna'} icon="x" tone=${S.skippedMeals ? 'bad' : ''} />
      <${Kpi} label="Volumen levantado" value=${S.vol >= 1000 ? numStr(round1(S.vol / 1000)) + ' t' : Math.round(S.vol) + ' kg'} sub="Peso × repeticiones" icon="trophy" />
    </div>
    ${mode === 'mes' && html`<${MonthCal} st=${st} month=${month} />`}
    <div class="cols">
      <section class="card"><div class="card-h"><h2>Medidas</h2>${mnames.length > 0 && html`<select id="pg-measure" class="sel sm" value=${mSel} onChange=${e => setMSel(e.target.value)}>${mnames.map(m => html`<option value=${m.name} selected=${m.name === mSel}>${m.name} (${m.unit})</option>`)}</select>`}</div>
        <${LineChart} data=${mSel ? measureSeries(st.id, mSel) : []} unit=${(mnames.find(m => m.name === mSel) || {}).unit || ''} /></section>
      <section class="card"><div class="card-h"><h2>Fuerza por ejercicio</h2>${exNames.length > 0 && html`<select id="pg-ex" class="sel sm" value=${exSel} onChange=${e => setExSel(e.target.value)}>${exNames.map(n => html`<option value=${n} selected=${n === exSel}>${n}</option>`)}</select>`}</div>
        <${LineChart} data=${exSeries} unit="kg" color="var(--c-blue)" /><p class="muted sm">Peso máximo por sesión.</p></section>
    </div>
    <section class="card"><div class="card-h"><h2>Historial del periodo</h2><span class="muted sm">${fmtD(range[0])} – ${fmtD(range[1] > t ? t : range[1])}</span></div>

function MonthCal({ st, month }) {
  const first = month + '-01'; const start = weekStart(first); const t = today();
  const last = addDays(addMonths(first, 1), -1);
  const cells = []; let d = start; while (d <= last || dow(d) !== 0) { cells.push(d); d = addDays(d, 1); if (cells.length > 42) break; }
  const logs = Q.logs(st.id);
  return html`<section class="card"><div class="card-h"><h2>${MESL[parseD(first).getMonth()]} ${first.slice(0, 4)}</h2>
    <div class="legend"><span><i class="lg-sw good"></i>Entrenó</span><span><i class="lg-sw bad"></i>Omitió</span><span><i class="lg-sw diet"></i>Dieta completa</span></div></div>
    <div class="cal">${DIAS3.map(x => html`<div class="cal-h">${x}</div>`)}
      ${cells.map(c => {
        const inM = c.slice(0, 7) === month; const L = logs.filter(l => l.date === c);
        const done = L.some(l => l.status === 'done'), sk = L.some(l => l.status === 'skipped');
        const pm = plannedMeals(st, dow(c)); const ml = Q.meal(st.id, c); const ch = ml?.checks || {};
        const ate = pm.filter(x => ch[x.meal.id] === 'done').length, skm = pm.filter(x => ch[x.meal.id] === 'skip').length;
        return html`<div class=${'cal-c ' + (inM ? '' : 'out ') + (c === t ? 'today ' : '') + (done ? 'good ' : sk ? 'bad ' : '')} title=${`${fmtD(c)}${done ? ' · entrenó' : ''}${sk ? ' · omitió' : ''}${pm.length ? ` · comidas ${ate}/${pm.length}` : ''}`}>
          <span>${parseD(c).getDate()}</span>${pm.length > 0 && c <= t && (ate || skm) ? html`<i class=${'cal-diet ' + (ate === pm.length ? 'full' : skm ? 'bad' : '')}></i>` : ''}</div>`;
      })}</div></section>`;
}

function studentSummary(s) {
  const t = today();
  const s30 = stats(s, addDays(t, -29), t), s7 = stats(s, addDays(t, -6), t);
  const lr = lastReview(s.id); const om = omissionsSince(s, lr ? lr.date : s.inicio);
  const w = weightSeries(s.id);
  const logs = Q.logs(s.id); const last = logs[logs.length - 1];
  return { s30, s7, om, w, last, nOm: om.days.length + om.meals.length, dW: w.length > 1 ? round1(w[w.length - 1].y - w[0].y) : null };
}

}

const PHOTO_NAMES = ['Frontal', 'Posterior', 'Perfil derecho', 'Perfil izquierdo', 'Espalda', 'Pecho', 'Abdomen'];
function ReviewWizard({ close, st }) {
  const tr = Q.trainer(st.trainerId);
  const [step, setStep] = useState(0);
  const [photos, setPhotos] = useState([]);
  const [pending, setPending] = useState(null);
  const [useTpl, setUseTpl] = useState(null);
  const [rows, setRows] = useState([]);
  const [notes, setNotes] = useState('');
  const [next, setNext] = useState(addDays(today(), 14));
  const [later, setLater] = useState(false);
  const [saving, setSaving] = useState(false);
  const fileRef = useRef();
  const tpls = Q.tpls(st.trainerId, 'measure');
  const lr = lastReview(st.id);
  const om = omissionsSince(st, lr ? lr.date : st.inicio);
  const prevVal = name => { if (!lr) return null; const m = (lr.measures || []).find(x => normTxt(x.name) === normTxt(name)); return m ? `${m.value} ${m.unit}` : null; };
  const pick = async e => {
    const file = e.target.files && e.target.files[0]; e.target.value = '';
    if (!file) return;
    try { const src = await compressImage(file); setPending({ src, name: PHOTO_NAMES[photos.length] || 'Foto ' + (photos.length + 1) }); } catch (er) { toast('No se pudo leer la imagen', 'bad'); }
  };
  const applyTpl = tp => { setUseTpl(true); setRows(tp.fields.map(f => ({ name: f.name, unit: f.unit, value: '' }))); };
  const steps = ['Fotos', 'Medidas', 'Observaciones', 'Próxima revisión'];
  async function save() {
    setSaving(true);
    try {
      const ph = [];
      for (const p of photos) ph.push({ pid: await Store.putPhoto(p.src, { studentId: st.id, trainerId: st.trainerId }), name: p.name });
      const t = today();
      Store.put('reviews', { id: uid(), studentId: st.id, trainerId: st.trainerId, date: t, photos: ph, measures: rows.filter(r => r.name.trim()).map(r => ({ name: r.name.trim(), unit: r.unit, value: r.value })), notes, omissions: { days: om.days, meals: om.meals }, createdAt: Date.now() });
      Store.put('students', Object.assign({}, Q.student(st.id), { nextReview: later ? null : next }));
      close(); toast('Revisión guardada' + (later ? '' : ' · próxima: ' + fmtD(next)));
    } catch (e) { setSaving(false); toast('No se pudieron guardar las fotos. Intenta con menos imágenes.', 'bad'); }
  }
  return html`<${Modal} title=${`Revisión de ${fullName(st)}`} sub=${fmtLong(today())} onClose=${async () => { if (photos.length || rows.some(r => r.value)) { if (!(await confirmBox({ title: '¿Salir de la revisión?', text: 'Perderás las fotos y medidas que no guardaste.', ok: 'Salir', danger: true }))) return; } close(); }} size="full"
    footer=${html`<button class="btn ghost" disabled=${step === 0} onClick=${() => setStep(step - 1)}><${Ic} n="chevL" s=${15} />Atrás</button><span class="grow"></span>
      ${step < 3 ? html`<button class="btn primary" onClick=${() => setStep(step + 1)}>Continuar<${Ic} n="chevR" s=${15} /></button>` : html`<button class="btn primary" disabled=${saving} onClick=${save}>${saving ? 'Guardando…' : 'Guardar revisión'}</button>`}`}>
    <ol class="stepper">${steps.map((x, i) => html`<li class=${i === step ? 'on' : i < step ? 'done' : ''}><button onClick=${() => setStep(i)}><span>${i < step ? html`<${Ic} n="check" s=${13} w=${3} />` : i + 1}</span>${x}</button></li>`)}</ol>
    <div class="wiz">
    ${step === 0 && html`<div>
      <h3 class="wiz-t">Fotos del cuerpo actual</h3><p class="muted">Agrega una o varias fotos y ponle nombre a cada una.</p>
      <input type="file" accept="image/*" ref=${fileRef} hidden onChange=${pick} />
      ${pending ? html`<div class="ph-pending"><img src=${pending.src} alt="Vista previa" />
        <div class="stack-s"><${Field} label="Nombre de la foto"><input id="ph-name" value=${pending.name} onInput=${e => setPending({ ...pending, name: e.target.value })} /><//>
          <div class="chips">${PHOTO_NAMES.map(n => html`<button type="button" class=${'chip ' + (pending.name === n ? 'on' : '')} onClick=${() => setPending({ ...pending, name: n })}>${n}</button>`)}</div>
          <div class="row gap-s"><button class="btn primary" onClick=${() => { setPhotos([...photos, pending]); setPending(null); }}><${Ic} n="check" s=${15} />Guardar foto</button><button class="btn ghost" onClick=${() => setPending(null)}>Descartar</button></div></div></div>`
      : html`<button class="dropzone" onClick=${() => fileRef.current.click()}><${Ic} n="camera" s=${26} /><strong>Agregar foto</strong><span class="muted sm">Desde la cámara o la galería</span></button>`}
      ${photos.length > 0 && html`<div class="thumbs mt">${photos.map((p, i) => html`<div class="thumb"><img src=${p.src} alt=${p.name} /><input aria-label="Nombre de la foto" value=${p.name} onInput=${e => { const n = photos.slice(); n[i] = { ...p, name: e.target.value }; setPhotos(n); }} /><button class="icon-btn sm x" aria-label="Quitar foto" onClick=${() => setPhotos(photos.filter((_, j) => j !== i))}><${Ic} n="x" s=${14} /></button></div>`)}</div>`}
      ${!photos.length && !pending && html`<p class="muted sm mt">Las fotos son opcionales: puedes continuar sin ellas.</p>`}
    </div>`}
    ${step === 1 && html`<div>
      <h3 class="wiz-t">Medidas</h3>
      ${useTpl === null ? html`<p>¿Usar medidas predeterminadas?</p>
        <div class="choice2"><button class="choice" disabled=${!tpls.length} onClick=${() => tpls.length === 1 ? applyTpl(tpls[0]) : setUseTpl('pick')}><${Ic} n="layers" s=${22} /><strong>Sí, usar una plantilla</strong><span class="muted sm">${tpls.length ? tpls.length + ' disponibles' : 'Aún no tienes plantillas de medidas'}</span></button>
          <button class="choice" onClick=${() => { setUseTpl(false); setRows([{ name: '', unit: 'cm', value: '' }]); }}><${Ic} n="plus" s=${22} /><strong>No, agregar mis medidas</strong><span class="muted sm">Defines cada medida y su unidad</span></button></div>`
      : useTpl === 'pick' ? html`<p>Elige la plantilla:</p><div class="choice2">${tpls.map(tp => html`<button class="choice" onClick=${() => applyTpl(tp)}><strong>${tp.name}</strong><span class="muted sm">${tp.fields.map(f => f.name).join(', ')}</span></button>`)}</div>`
      : html`<div class="mrows">${rows.map((r, i) => html`<div class="mrow">
          <input class="m-name" aria-label="Medida" placeholder="Medida (ej. Cintura)" value=${r.name} onInput=${e => { const n = rows.slice(); n[i] = { ...r, name: e.target.value }; setRows(n); }} />
          <input class="m-val" aria-label="Valor" inputmode="decimal" placeholder="Valor" value=${r.value} onInput=${e => { const n = rows.slice(); n[i] = { ...r, value: e.target.value.replace(',', '.') }; setRows(n); }} />
          <input class="m-unit" aria-label="Unidad" placeholder="cm" value=${r.unit} onInput=${e => { const n = rows.slice(); n[i] = { ...r, unit: e.target.value }; setRows(n); }} />
          <span class="m-prev muted sm">${prevVal(r.name) ? 'Antes: ' + prevVal(r.name) : ''}</span>
          <button class="icon-btn sm" aria-label="Quitar medida" onClick=${() => setRows(rows.filter((_, j) => j !== i))}><${Ic} n="x" s=${15} /></button></div>`)}
        <div class="row gap-s wrap"><button class="btn ghost sm" onClick=${() => setRows([...rows, { name: '', unit: 'cm', value: '' }])}><${Ic} n="plus" s=${15} />Agregar medida</button><button class="link sm" onClick=${() => { setUseTpl(null); setRows([]); }}>Cambiar de plantilla</button></div></div>`}
    </div>`}
    ${step === 2 && html`<div>
      <h3 class="wiz-t">Desde la última revisión${lr ? ' (' + fmtD(lr.date) + ')' : ''}</h3>
      <div class="kpis three"><${Kpi} label="Entrenamientos" value=${om.s.done} icon="dumbbell" /><${Kpi} label="Días omitidos" value=${om.days.length} tone=${om.days.length ? 'bad' : 'good'} icon="alert" /><${Kpi} label="Dieta cumplida" value=${om.s.dietPct == null ? '—' : om.s.dietPct + '%'} sub=${`${om.meals.length} comidas omitidas`} tone=${om.meals.length ? 'bad' : ''} icon="food" /></div>
      ${(om.days.length > 0 || om.meals.length > 0) && html`<div class="omit-box">
        ${om.days.map(d => html`<div class="omit-i"><${Pill} k="bad">Entrenamiento<//><strong>${fmtD(d.date)} · ${d.day}</strong><em>${d.reason ? '“' + d.reason + '”' : 'Sin motivo'}</em></div>`)}
        ${om.meals.map(m => html`<div class="omit-i"><${Pill} k="bad">Comida<//><strong>${fmtD(m.date)} · ${m.meal}</strong><em>${m.reason ? '“' + m.reason + '”' : 'Sin motivo'}</em></div>`)}
      </div>`}
      <${Field} label="Observaciones de la revisión"><textarea id="rv-notes" rows="4" placeholder="Cómo lo ves, qué ajustar en la dieta o la rutina…" value=${notes} onInput=${e => setNotes(e.target.value)}></textarea><//>
    </div>`}
    ${step === 3 && html`<div>
      <h3 class="wiz-t">Fijar próxima revisión</h3>
      <div class="choice2"><label class=${'choice ' + (!later ? 'on' : '')}><input type="radio" name="nx" checked=${!later} onChange=${() => setLater(false)} /><strong>Asignar fecha</strong>
          <input id="rv-next" type="date" value=${next} min=${today()} onInput=${e => setNext(e.target.value)} onClick=${() => setLater(false)} />
          <div class="chips">${[7, 14, 21, 30].map(d => html`<button type="button" class=${'chip ' + (!later && next === addDays(today(), d) ? 'on' : '')} onClick=${() => { setLater(false); setNext(addDays(today(), d)); }}>+${d} días</button>`)}</div></label>
        <label class=${'choice ' + (later ? 'on' : '')}><input type="radio" name="nx" checked=${later} onChange=${() => setLater(true)} /><strong>Asignar después</strong><span class="muted sm">Quedará sin fecha hasta que la definas.</span></label></div>
      <div class="panel mt"><div class="eyebrow">Resumen</div><div class="kv"><span>Fotos</span><strong>${photos.length}</strong></div><div class="kv"><span>Medidas registradas</span><strong>${rows.filter(r => r.name && r.value).length}</strong></div><div class="kv"><span>Próxima revisión</span><strong>${later ? 'Sin fecha' : fmtD(next)}</strong></div></div>
    </div>`}
    </div>
  <//>`;
}

/* ---------- Editor de dieta ---------- */
function productNames(tid) {
  const s = new Set(['Avena', 'Arroz cocido', 'Pechuga de pollo', 'Carne de res', 'Huevo', 'Clara de huevo', 'Pan integral', 'Plátano', 'Manzana', 'Palta', 'Atún en agua', 'Pescado', 'Camote', 'Papa', 'Quinua cocida', 'Yogur griego', 'Leche descremada', 'Queso fresco', 'Almendras', 'Mantequilla de maní', 'Aceite de oliva', 'Verduras salteadas', 'Ensalada mixta', 'Proteína en polvo', 'Granola', 'Cacao en polvo', 'Agua', 'Tomate', 'Cebolla roja', 'Lentejas cocidas', 'Frejoles cocidos', 'Fideos integrales']);
  Q.tpls(tid, 'recipe').forEach(r => (r.items || []).forEach(i => i.name && s.add(i.name)));
  Q.students(tid).forEach(st => Object.values(st.diet?.days || {}).forEach(d => Object.values(d).forEach(sl => [...(sl.items || []), ...(sl.dishes || []).flatMap(x => x.items || [])].forEach(i => i.name && s.add(i.name)))));
  return Array.from(s).sort();
}
function ItemRows({ items, onChange, lockNames }) {
  const upd = (i, k, v) => { const n = items.slice(); n[i] = { ...n[i], [k]: v }; onChange(n); };
  return html`<div class="irows">${items.map((it, i) => html`<div class="irow">
    <input class="i-q" aria-label="Cantidad" inputmode="decimal" value=${it.q} onInput=${e => upd(i, 'q', e.target.value.replace(',', '.'))} />
    ${lockNames ? html`<span class="i-u ro">${it.u}</span><span class="i-n ro">${it.name}</span>` : html`
    <select class="i-u" aria-label="Unidad" value=${it.u} onChange=${e => upd(i, 'u', e.target.value)}>${UNITS.map(u => html`<option value=${u} selected=${u === it.u}>${u}</option>`)}</select>
    <input class="i-n" aria-label="Producto" list="dl-products" placeholder="Producto" value=${it.name} onInput=${e => upd(i, 'name', e.target.value)} />
    <button class="icon-btn sm" aria-label="Quitar producto" onClick=${() => onChange(items.filter((_, j) => j !== i))}><${Ic} n="x" s=${15} /></button>`}
  </div>`)}</div>`;
}
function StepRows({ steps, onChange }) {
  return html`<div class="srows">${steps.map((s, i) => html`<div class="srow"><span class="sn">Paso ${i + 1}</span><input aria-label=${'Paso ' + (i + 1)} value=${s} placeholder="Describe el paso" onInput=${e => { const n = steps.slice(); n[i] = e.target.value; onChange(n); }} /><button class="icon-btn sm" aria-label="Quitar paso" onClick=${() => onChange(steps.filter((_, j) => j !== i))}><${Ic} n="x" s=${15} /></button></div>`)}
    <button class="link sm" onClick=${() => onChange([...steps, ''])}>+ Agregar paso</button></div>`;
}
function MealsEditor({ meals, onChange }) {
  const upd = (i, k, v) => { const n = meals.slice(); n[i] = { ...n[i], [k]: v }; onChange(n); };
  const mv = (i, d) => { const n = meals.slice(); const j = i + d; if (j < 0 || j >= n.length) return; [n[i], n[j]] = [n[j], n[i]]; onChange(n); };
  return html`<div class="mealsed">${meals.map((m, i) => html`<div class="mrow2">
    <span class="exn">${i + 1}</span><input aria-label="Nombre de la comida" value=${m.name} placeholder="Nombre de la comida" onInput=${e => upd(i, 'name', e.target.value)} />
    <input type="time" aria-label="Hora" value=${m.time || ''} onInput=${e => upd(i, 'time', e.target.value)} />
    <button class="icon-btn sm" aria-label="Subir" onClick=${() => mv(i, -1)}><${Ic} n="up" s=${15} /></button><button class="icon-btn sm" aria-label="Bajar" onClick=${() => mv(i, 1)}><${Ic} n="down" s=${15} /></button>
    <button class="icon-btn sm" aria-label="Quitar comida" onClick=${() => onChange(meals.filter((_, j) => j !== i))}><${Ic} n="x" s=${15} /></button></div>`)}
    <button class="btn ghost sm" onClick=${() => onChange([...meals, { id: 'm' + uid(), name: '', time: '' }])}><${Ic} n="plus" s=${15} />Agregar comida</button></div>`;
}
function DishPicker({ close, tid, onPick }) {
  const list = Q.tpls(tid, 'recipe'); const [q, setQ] = useState('');
  const f = list.filter(r => !q || normTxt(r.name).includes(normTxt(q)));
  return html`<${Modal} title="Agregar plato guardado" onClose=${close} size="sm">
    <div class="search mb"><${Ic} n="search" s=${16} /><input id="dp-q" placeholder="Buscar plato" value=${q} onInput=${e => setQ(e.target.value)} /></div>
    ${f.length ? html`<ul class="list">${f.map(r => html`<li class="li clickable" onClick=${() => { onPick(r); close(); }}><${Ic} n="book" s=${18} /><div class="li-main"><strong>${r.name}</strong><span class="muted sm">${(r.items || []).map(itemShort).join(' + ')}</span></div><${Ic} n="plus" s=${16} /></li>`)}</ul>`
      : html`<${Empty} icon="book" title="Sin platos guardados" text="Crea platos con su preparación en Plantillas → Platos." />`}
  <//>`;
}

function DietEditor({ close, st, tr }) {
  const [diet, setDiet] = useState(() => st.diet && (st.diet.meals || []).length ? clone(st.diet) : null);
  const [setup, setSetup] = useState(diet ? null : 'ask');
  const [newMeals, setNewMeals] = useState([{ id: 'm1', name: 'Desayuno', time: '07:00' }, { id: 'm3', name: 'Almuerzo', time: '13:00' }, { id: 'm5', name: 'Cena', time: '20:00' }]);
  const [day, setDay] = useState(dow(today()));
  const [mealsOpen, setMealsOpen] = useState(false);
  const [copyOpen, setCopyOpen] = useState(false);
  const [copyTo, setCopyTo] = useState([]);
  const [stepsOpen, setStepsOpen] = useState({});
  const [dirty, setDirty] = useState(false);
  const schemes = Q.tpls(tr.id, 'scheme');
  const names = useMemo(() => productNames(tr.id), []);
  const upd = fn => { setDiet(d => { const n = clone(d); fn(n); return n; }); setDirty(true); };
  const slot = (d, mid) => ((diet.days || {})[d] || {})[mid] || emptySlot();
  const setSlot = (d, mid, s) => upd(n => { n.days = n.days || {}; n.days[d] = n.days[d] || {}; n.days[d][mid] = s; });
  const startWith = meals => { setDiet({ meals: meals.map(m => ({ id: m.id || 'm' + uid(), name: m.name, time: m.time || '' })), days: {} }); setSetup(null); setDirty(true); };
  const applyScheme = sc => upd(n => { const old = n.meals; n.meals = sc.meals.map(m => { const match = old.find(o => normTxt(o.name) === normTxt(m.name)); return { id: match ? match.id : 'm' + uid(), name: m.name, time: m.time || '' }; }); });
  const save = () => { const o = clone(Q.student(st.id)); o.diet = diet; Store.put('students', o); toast('Dieta guardada'); close(); };
  const tryClose = async () => { if (dirty && !(await confirmBox({ title: '¿Salir sin guardar?', text: 'Perderás los cambios de la dieta.', ok: 'Salir', danger: true }))) return; close(); };
  const saveAsDish = async (sl, mealName) => {
    const name = await confirmBox({ title: 'Guardar como plato', text: 'Quedará en tus platos para usarlo con otros alumnos.', ok: 'Guardar', input: { label: 'Nombre del plato', required: true, placeholder: mealName } });
    if (!name || name === true) return;
    Store.put('tpl', { id: uid(), trainerId: tr.id, kind: 'recipe', name, items: clone(sl.items), steps: (sl.steps || []).filter(Boolean), createdAt: Date.now() });
    toast('Plato guardado');
  };
  return html`<${Modal} title=${`Dieta de ${fullName(st)}`} sub=${setup ? 'Configuración inicial' : 'Agrega productos o platos a cada comida'} onClose=${tryClose} size="full"
    footer=${setup ? html`<button class="btn ghost" onClick=${tryClose}>Cancelar</button>` : html`<button class="btn ghost" onClick=${tryClose}>Cancelar</button><span class="grow"></span><button class="btn primary" onClick=${save}><${Ic} n="check" s=${15} />Guardar dieta</button>`}>
    <datalist id="dl-products">${names.map(n => html`<option value=${n} />`)}</datalist>
    ${setup === 'ask' && html`<div class="wiz"><h3 class="wiz-t">¿Usar un esquema de dieta predeterminado?</h3>
      <div class="choice2"><button class="choice" disabled=${!schemes.length} onClick=${() => setSetup('pick')}><${Ic} n="layers" s=${22} /><strong>Sí, elegir un esquema</strong><span class="muted sm">${schemes.length ? schemes.map(s => s.name).join(' · ') : 'Aún no tienes esquemas'}</span></button>
        <button class="choice" onClick=${() => setSetup('new')}><${Ic} n="plus" s=${22} /><strong>No, crear desde cero</strong><span class="muted sm">Defines cuántas comidas y sus nombres</span></button></div></div>`}
    ${setup === 'pick' && html`<div class="wiz"><h3 class="wiz-t">Elige el esquema</h3><div class="choice2">${schemes.map(sc => html`<button class="choice" onClick=${() => startWith(sc.meals)}><strong>${sc.name}</strong><span class="muted sm">${sc.meals.map(m => m.name).join(' · ')}</span></button>`)}</div><button class="link mt" onClick=${() => setSetup('ask')}>← Volver</button></div>`}
    ${setup === 'new' && html`<div class="wiz"><h3 class="wiz-t">Comidas del día</h3><p class="muted">Se aplican a los 7 días; luego llenas cada una.</p><${MealsEditor} meals=${newMeals} onChange=${setNewMeals} />
      <div class="row gap-s mt"><button class="btn primary" disabled=${!newMeals.filter(m => m.name.trim()).length} onClick=${() => startWith(newMeals.filter(m => m.name.trim()))}>Continuar</button><button class="link" onClick=${() => setSetup('ask')}>← Volver</button></div></div>`}
    ${!setup && diet && html`<div class="ded">
      <div class="ded-bar">
        <div class="daychips">${DIAS3.map((d, i) => { const has = diet.meals.some(m => slotHas(slot(i, m.id))); return html`<button class=${'dchip ' + (day === i ? 'on' : '')} onClick=${() => setDay(i)}>${d}${has && html`<i class="dot-s"></i>`}</button>`; })}</div>
        <div class="row gap-s wrap">
          <button class="btn ghost sm" onClick=${() => setMealsOpen(!mealsOpen)}><${Ic} n="edit" s=${15} />Comidas (${diet.meals.length})</button>
          ${schemes.length > 0 && html`<select id="de-scheme" class="sel sm" value="" onChange=${e => { const sc = schemes.find(x => x.id === e.target.value); if (sc) applyScheme(sc); e.target.value = ''; }}><option value="">Aplicar esquema…</option>${schemes.map(s => html`<option value=${s.id}>${s.name}</option>`)}</select>`}
          <button class="btn ghost sm" onClick=${() => { setCopyOpen(!copyOpen); setCopyTo([]); }}><${Ic} n="copy" s=${15} />Copiar ${DIAS[day].toLowerCase()} a…</button>
        </div>
      </div>
      ${mealsOpen && html`<div class="panel"><div class="eyebrow">Comidas del día (todas las jornadas)</div><${MealsEditor} meals=${diet.meals} onChange=${m => upd(n => { n.meals = m; })} /></div>`}
      ${copyOpen && html`<div class="panel row gap-s wrap"><span>Copiar el ${DIAS[day].toLowerCase()} a:</span>${DIAS3.map((d, i) => i !== day && html`<label class="chk"><input type="checkbox" checked=${copyTo.includes(i)} onChange=${e => setCopyTo(e.target.checked ? [...copyTo, i] : copyTo.filter(x => x !== i))} />${d}</label>`)}
        <button class="btn sm" disabled=${!copyTo.length} onClick=${() => { upd(n => { copyTo.forEach(i => { n.days[i] = clone((n.days || {})[day] || {}); }); }); setCopyOpen(false); toast('Día copiado'); }}>Copiar</button></div>`}
      <h3 class="day-title">${DIAS[day]}</h3>
      <div class="meal-eds">${diet.meals.map(m => { const sl = slot(day, m.id); const key = day + '_' + m.id; const stOpen = stepsOpen[key] || (sl.steps || []).length > 0; return html`<section class="meal-ed">
        <header><strong>${m.name || 'Comida'}</strong>${m.time && html`<span class="muted sm">${m.time}</span>`}</header>
        ${(sl.dishes || []).map((d, di) => html`<div class="dish-ed"><div class="row between"><span class="dish-n"><${Ic} n="book" s=${14} /> ${d.name}</span><button class="icon-btn sm" aria-label="Quitar plato" onClick=${() => setSlot(day, m.id, { ...sl, dishes: sl.dishes.filter((_, j) => j !== di) })}><${Ic} n="x" s=${15} /></button></div>
          <${ItemRows} items=${d.items || []} lockNames onChange=${items => { const ds = sl.dishes.slice(); ds[di] = { ...d, items }; setSlot(day, m.id, { ...sl, dishes: ds }); }} />
          ${(d.steps || []).length > 0 && html`<ol class="steps sm">${d.steps.map(x => html`<li>${x}</li>`)}</ol>`}</div>`)}
        <${ItemRows} items=${sl.items || []} onChange=${items => setSlot(day, m.id, { ...sl, items })} />
        <div class="row gap-s wrap">
          <button class="btn ghost sm" onClick=${() => setSlot(day, m.id, { ...sl, items: [...(sl.items || []), { q: '', u: 'g', name: '' }] })}><${Ic} n="plus" s=${15} />Producto</button>
          <button class="btn ghost sm" onClick=${() => openModal(DishPicker, { tid: tr.id, onPick: r => setSlot(day, m.id, { ...sl, dishes: [...(sl.dishes || []), { rid: r.id, name: r.name, items: clone(r.items || []), steps: clone(r.steps || []) }] }) })}><${Ic} n="book" s=${15} />Plato guardado</button>
          ${!stOpen && (sl.items || []).length > 0 && html`<button class="link sm" onClick=${() => setStepsOpen({ ...stepsOpen, [key]: true })}>+ Receta (opcional)</button>`}
          ${(sl.items || []).filter(i => i.name).length > 1 && html`<button class="link sm" onClick=${() => saveAsDish(sl, m.name)}>Guardar como plato</button>`}
        </div>
        ${stOpen && html`<div class="recipe-ed"><div class="eyebrow">Preparación (opcional)</div><${StepRows} steps=${sl.steps && sl.steps.length ? sl.steps : ['']} onChange=${steps => setSlot(day, m.id, { ...sl, steps })} /></div>`}
      </section>`; })}</div>
    </div>`}
  <//>`;
}

/* ---------- Editor de rutina ---------- */
const DAY_SUGGEST = ['Pecho', 'Espalda', 'Pierna', 'Piernas', 'Hombros', 'Brazos', 'Glúteos', 'Torso', 'Full body', 'Core', 'Cardio', 'Empuje', 'Jalón'];
function ExRows({ list, onChange }) {
  const upd = (i, k, v) => { const n = list.slice(); n[i] = { ...n[i], [k]: v }; onChange(n); };
  const mv = (i, d) => { const n = list.slice(); const j = i + d; if (j < 0 || j >= n.length) return; [n[i], n[j]] = [n[j], n[i]]; onChange(n); };
  return html`<div class="exrows">${list.map((e, i) => html`<div class="exrow">

function setMeal(s, date, mealId, val, reason) {
  const id = `${s.id}_${date}`; const cur = Store.get('meals', id);
  const o = cur ? clone(cur) : { id, studentId: s.id, trainerId: s.trainerId, date, checks: {}, reasons: {} };
  o.trainerId = s.trainerId;
  o.checks = o.checks || {}; o.reasons = o.reasons || {};
  if (val) o.checks[mealId] = val; else delete o.checks[mealId];
  if (reason != null) o.reasons[mealId] = reason; else if (val !== 'skip') delete o.reasons[mealId];
  Store.put('meals', o);
}
function TodayMeals({ s, date = today() }) {
  const pm = dietDay(s, dow(date)); const log = Q.meal(s.id, date); const ch = log?.checks || {};
  const planned = pm.filter(x => slotHas(x.slot));
  if (!planned.length) return html`<${Empty} icon="food" title="Sin comidas para hoy" text="Tu entrenador aún no asigna la dieta de este día." />`;
  const done = planned.filter(x => ch[x.meal.id] === 'done').length;
  const skip = async m => {
    const r = await confirmBox({ title: `¿Omitir ${m.name.toLowerCase()}?`, text: 'Contará como comida no cumplida y tu entrenador lo verá.', ok: 'Omitir comida', danger: true, input: { label: 'Motivo (opcional)', placeholder: 'Ej. No tuve tiempo' } });
    if (r) setMeal(s, date, m.id, 'skip', typeof r === 'string' ? r : '');
  };
  return html`<div class="tmeals">
    <div class="row between mb"><span class="muted sm">${done} de ${planned.length} comidas cumplidas</span><div class="mb-track w120"><div class="mb-fill good" style=${`width:${done / planned.length * 100}%`}></div></div></div>
    ${planned.map(({ meal, slot }) => { const v = ch[meal.id]; return html`<div class=${'tmeal ' + (v || '')}>
      <button class="tm-check" aria-label=${v === 'done' ? 'Desmarcar comida' : 'Marcar como comida'} aria-pressed=${v === 'done'} onClick=${() => setMeal(s, date, meal.id, v === 'done' ? null : 'done')}>${v === 'done' ? html`<${Ic} n="check" s=${18} w=${3} />` : v === 'skip' ? html`<${Ic} n="x" s=${18} w=${3} />` : ''}</button>
      <div class="tm-b"><div class="row between"><strong>${meal.name}</strong>${meal.time && html`<span class="muted sm">${meal.time}</span>`}</div><${SlotView} slot=${slot} />
        ${v === 'skip' && html`<p class="sm bad-t">Omitida${(log.reasons || {})[meal.id] ? ': “' + log.reasons[meal.id] + '”' : ''} <button class="link sm" onClick=${() => setMeal(s, date, meal.id, null)}>Deshacer</button></p>`}</div>
      ${!v && html`<button class="btn ghost sm" onClick=${() => skip(meal)}>Omitir</button>`}
    </div>`; })}
  </div>`;
}

}

}

  const [now, setNow] = useState(Date.now());

        ${imps.filter(i => i.kind === 'up').length ? html`<ul class="list">${imps.filter(i => i.kind === 'up').map(i => html`<li class="li"><span class="dot good"></span><div class="li-main"><strong>Mejoraste ${i.name}</strong><span class="muted sm">${i.txt} respecto a la ${i.label}</span></div><${Ic} n="up" s=${18} cls="good-t" /></li>`)}</ul>`
